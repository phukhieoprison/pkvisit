
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">

  <!-- รองรับมือถือและพื้นที่ขอบจอ -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <meta name="theme-color" content="#800000">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>//เรือนจำอำเภอภูเขียว//</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family: Arial, sans-serif;
    }

    /* หน้าจอหลัก */
    #app-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #ffffff;
    }

    /* iframe เต็มจอ */
    #app-frame {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      border: none;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #ffffff;
    }

    /* Loading Screen */
    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      width: 100%;
      height: 100vh;
      height: 100dvh;

      background: #800000;
      color: #ffffff;

      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);

      opacity: 1;
      visibility: visible;

      transition:
        opacity 0.5s ease,
        visibility 0.5s ease;
    }

    #loading-screen.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* วงกลม Loading */
    .loader {
      width: 48px;
      height: 48px;

      border: 5px solid rgba(255, 255, 255, 0.25);
      border-top-color: #ffffff;

      border-radius: 50%;

      animation: spin 0.8s linear infinite;

      margin-bottom: 20px;
    }

    .app-title {
      font-size: 22px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 10px;
    }

    .loading-text {
      font-size: 14px;
      opacity: 0.85;
      text-align: center;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ป้องกันการเลือกข้อความโดยไม่ตั้งใจ */
    body {
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>

<body>

  <!-- Loading Screen -->
  <div id="loading-screen">
    <div class="loader"></div>

    <div class="app-title">
      //เรือนจำอำเภอภูเขียว//
    </div>

    <div class="loading-text">
      กำลังโหลดระบบ กรุณารอสักครู่...
    </div>
  </div>

  <!-- Google Apps Script Web App -->
  <div id="app-container">

    <iframe
      id="app-frame"
      src="https://script.google.com/macros/s/AKfycbxQatDVjsupv2ZMJfL0Ioex_Lbu-KFDdg-dvJaXMTjqRxJPO-iSOGX8qJoA1QwO0Mb_mg/exec"
      allow="fullscreen"
      allowfullscreen
      loading="eager"
      referrerpolicy="no-referrer-when-downgrade">
    </iframe>

  </div>

  <script>
    const appFrame = document.getElementById("app-frame");
    const loadingScreen = document.getElementById("loading-screen");

    let loadingFinished = false;

    function hideLoading() {
      if (loadingFinished) return;

      loadingFinished = true;

      loadingScreen.classList.add("hide");

      setTimeout(() => {
        loadingScreen.style.display = "none";
      }, 500);
    }

    // ซ่อน Loading เมื่อ iframe โหลดเสร็จ
    appFrame.addEventListener("load", function () {
      hideLoading();
    });

    // ป้องกัน Loading ค้างนานเกินไป
    // หาก iframe ไม่ส่งเหตุการณ์ load
    setTimeout(function () {
      hideLoading();
    }, 30000);
  </script>

</body>
</html>
